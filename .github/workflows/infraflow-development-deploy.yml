name: "noddeLambdachange development CI/CD"

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: development
        type: choice
        options:
          - development
          - staging
          - production

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  DEPLOY_ENVIRONMENT: development
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: api-gateway-lambda-iam-role-app
  ECS_CLUSTER: infraflow-cluster
  ECS_SERVICE: iaasLambdaFunc
  S3_BUCKET: replace-with-s3-bucket
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
  LAMBDA_FUNCTION: iaasLambdaFunc
  K8S_NAMESPACE: default

jobs:
  deploy:
    name: Build, scan, and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: contains('serverless-api', 'react') || contains('serverless-api', 'node') || contains('serverless-api', 'static') || contains('serverless-api', 'serverless') || contains('serverless-api', 'kubernetes')
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Python
        if: contains('serverless-api', 'python')
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java
        if: contains('serverless-api', 'java')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: |
          if [ -f package.json ] && ! node -e "const pkg = require('./package.json'); process.exit(pkg.scripts && pkg.scripts.test ? 0 : 1)"; then
            echo "No npm test script found; skipping test step."
            exit 0
          fi
          npm test -- --watch=false


      - name: Build application
        run: npm run build --if-present

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Package Lambda artifact
        run: zip -r lambda.zip . -x ".git/*" ".github/*" ".env" ".env.*" "coverage/*" "node_modules/.cache/*" "lambda.zip"

      - name: Deploy Lambda function
        run: aws lambda update-function-code --function-name ${{ env.LAMBDA_FUNCTION }} --zip-file fileb://lambda.zip
