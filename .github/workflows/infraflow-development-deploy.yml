name: "LatestInfradeploymentpipeline development CI/CD"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: development
        type: choice
        options:
          - development
          - staging
          - production

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  DEPLOY_ENVIRONMENT: development
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: api-gateway-lambda-iam-role-app
  ECS_CLUSTER: infraflow-cluster
  ECS_SERVICE: serverless-api-service
  S3_BUCKET: replace-with-s3-bucket
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
  LAMBDA_FUNCTION: infraflow-iaasnode-6a687b40b7d910ba
  K8S_NAMESPACE: default

jobs:
  deploy:
    name: Build, scan, and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Lambda app directory
        run: |
          if [ -f "IAAS backend/lambda.js" ] && [ -f "IAAS backend/package.json" ]; then
            echo "LAMBDA_APP_DIR=IAAS backend" >> "$GITHUB_ENV"
          elif [ -f lambda.js ] && [ -f package.json ]; then
            echo "LAMBDA_APP_DIR=." >> "$GITHUB_ENV"
          elif [ -f "IAAS backend/package.json" ]; then
            echo "LAMBDA_APP_DIR=IAAS backend" >> "$GITHUB_ENV"
          elif [ -f package.json ]; then
            echo "LAMBDA_APP_DIR=." >> "$GITHUB_ENV"
          else
            echo "::error::No Lambda app found. Expected lambda.js plus package.json at repository root or IAAS backend/."
            exit 1
          fi
          echo "Lambda app directory: $(cat "$GITHUB_ENV" | grep '^LAMBDA_APP_DIR=' | tail -1 | cut -d= -f2-)"


      - name: Setup Node.js
        if: contains('serverless-api', 'react') || contains('serverless-api', 'node') || contains('serverless-api', 'static') || contains('serverless-api', 'serverless') || contains('serverless-api', 'kubernetes')
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            IAAS backend/package-lock.json

      - name: Setup Python
        if: contains('serverless-api', 'python')
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java
        if: contains('serverless-api', 'java')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies

        working-directory: ${{ env.LAMBDA_APP_DIR }}
        run: npm ci

      - name: Run tests
        run: echo "Skipping Lambda tests by default. Set a custom test command in Infraflow to run deployment tests."


      - name: Build application

        working-directory: ${{ env.LAMBDA_APP_DIR }}
        run: npm run build --if-present

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prune dev dependencies
        working-directory: ${{ env.LAMBDA_APP_DIR }}
        run: npm prune --omit=dev

      - name: Verify Lambda handler file
        working-directory: ${{ env.LAMBDA_APP_DIR }}
        run: |
          LAMBDA_HANDLER="$(aws lambda get-function-configuration --function-name "${{ env.LAMBDA_FUNCTION }}" --query Handler --output text)"
          HANDLER_MODULE="${LAMBDA_HANDLER%.*}"
          echo "Lambda handler configured in AWS: $LAMBDA_HANDLER"
          if [ -f "$HANDLER_MODULE.js" ] || [ -f "$HANDLER_MODULE.mjs" ] || [ -f "$HANDLER_MODULE.cjs" ]; then
            echo "Configured Lambda handler module exists in deployment package."
            exit 0
          fi
          echo "Configured handler module '$HANDLER_MODULE' was not found in $PWD. Inferring handler module from common Lambda entry files."
          INFERRED_HANDLER_MODULE=""
          for candidate in lambda index handler app server src/lambda src/index src/handler src/app; do
            for ext in js mjs cjs; do
              if [ -f "$candidate.$ext" ]; then
                INFERRED_HANDLER_MODULE="$candidate"
                break 2
              fi
            done
          done
          if [ -z "$INFERRED_HANDLER_MODULE" ]; then
            INFERRED_HANDLER_MODULE="$(find . -maxdepth 3 -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) | sort | sed 's#^./##;s#\.[^.]*$##' | head -1)"
          fi
          if [ -z "$INFERRED_HANDLER_MODULE" ]; then
            echo "::error::No JavaScript Lambda handler module was found in $PWD."
            find . -maxdepth 3 -type f | sort | head -80
            exit 1
          fi
          echo "Updating Lambda handler from '$LAMBDA_HANDLER' to '$INFERRED_HANDLER_MODULE.handler'."
          aws lambda update-function-configuration --function-name "${{ env.LAMBDA_FUNCTION }}" --handler "$INFERRED_HANDLER_MODULE.handler"
          aws lambda wait function-updated --function-name "${{ env.LAMBDA_FUNCTION }}"

      - name: Package Lambda artifact
        working-directory: ${{ env.LAMBDA_APP_DIR }}
        run: zip -r lambda.zip . -x ".git/*" ".github/*" ".env" ".env.*" "coverage/*" "node_modules/.cache/*" "lambda.zip"

      - name: Deploy Lambda function
        run: aws lambda update-function-code --function-name ${{ env.LAMBDA_FUNCTION }} --zip-file fileb://"${{ env.LAMBDA_APP_DIR }}/lambda.zip"
